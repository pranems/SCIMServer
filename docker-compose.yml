# Phase 3: PostgreSQL-backed SCIMServer
# Usage: docker compose up --build

services:
  postgres:
    image: postgres:17
    container_name: scimserver-postgres
    environment:
      POSTGRES_DB: scimdb
      POSTGRES_USER: scim
      POSTGRES_PASSWORD: scim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pg-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scim -d scimdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public by default. On a corporate device the registry is unreachable
        # from inside the build, so set NPM_REGISTRY before `docker compose build`.
        # See docs/LOCAL_DOCKER_BUILD.md.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: scimserver-api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://scim:scim@postgres:5432/scimdb?connect_timeout=10&pool_timeout=10
      PERSISTENCE_BACKEND: prisma
      JWT_SECRET: ${JWT_SECRET:-devjwtsecretkey123456}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-devscimclientsecret}
      SCIM_SHARED_SECRET: ${SCIM_SHARED_SECRET:-devscimsharedsecret}
      # WI-6: KEK for the re-viewable-credential-secret feature. Default is
      # cosmetic - set a private value in prod and keep it identical across
      # every instance + redeploy. NOT on the auth path.
      CREDENTIAL_KEK: ${CREDENTIAL_KEK:-changeme-credential-kek}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
