worker_processes auto;

# `info` is REQUIRED for the SSL handshake failure lines. Without it a REJECTED
# handshake is completely invisible: it produces no access-log entry anywhere,
# because no HTTP request was ever parsed.
error_log /dev/stderr info;

events { worker_connections 1024; }

# ===========================================================================
# LAYER 1 - STREAM FRONT DOOR on :8443
#
# ssl_preread PEEKS the ClientHello without terminating TLS. That gives two
# things nothing else can:
#
#   1. A log line for EVERY connection attempt, including ones that are about
#      to be rejected, together with the highest TLS version the client
#      OFFERED. A rejected handshake otherwise leaves no trace at all.
#   2. SNI-based routing to different TLS profiles. Because each profile is a
#      SEPARATE listening socket, this sidesteps nginx's documented limitation
#      that per-server ssl_protocols may fall back to the default server.
#
# The result is per-hostname TLS policy on ONE public port.
# ===========================================================================
stream {
    # Which internal TLS profile a connection is routed to, chosen by SNI.
    map $ssl_preread_server_name $tls_backend {
        ~^tls12\.    127.0.0.1:9444;   # permissive profile
        default      127.0.0.1:9443;   # strict profile, TLS 1.3 only
    }
    map $ssl_preread_server_name $tls_profile {
        ~^tls12\.    "permissive-tls12-tls13";
        default      "strict-tls13-only";
    }

    log_format tlsattempt '$time_iso8601 EVENT=handshake_attempt '
                          'client=$remote_addr '
                          'sni=$ssl_preread_server_name '
                          'offered_max=$ssl_preread_protocol '
                          'alpn=$ssl_preread_alpn_protocols '
                          'routed_to=$tls_profile '
                          'session_status=$status bytes_to_client=$bytes_sent';

    access_log /dev/stdout tlsattempt;

    server {
        listen 8443;
        # REQUIRED. Without this directive the ssl_preread module is inert and
        # every $ssl_preread_* variable evaluates to "-", silently. The config
        # still loads and traffic still flows, so the only symptom is empty
        # fields in the log: an inert-setting trap with no error message.
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every request that COMPLETED a handshake, with the protocol and cipher
    # actually negotiated.
    log_format tlsinfo '$time_iso8601 EVENT=request '
                       'profile=$tls_profile_name '
                       'proto=$ssl_protocol cipher=$ssl_cipher '
                       'sni=$ssl_server_name status=$status "$request"';

    access_log /dev/stdout tlsinfo;

    sendfile      on;
    server_tokens off;

    # -----------------------------------------------------------------------
    # STRICT profile - TLS 1.3 ONLY. Internal, reached via the stream layer.
    # -----------------------------------------------------------------------
    server {
        listen 9443 ssl;
        http2 on;
        server_name _;
        set $tls_profile_name "strict-tls13-only";

        ssl_protocols       TLSv1.3;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_session_cache   shared:SSL13:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       https;
            proxy_set_header   X-Forwarded-TLS-Version $ssl_protocol;
            proxy_set_header   X-Forwarded-TLS-Cipher  $ssl_cipher;
            proxy_set_header   X-TLS-Profile           $tls_profile_name;
            proxy_read_timeout 300s;
        }
    }

    # -----------------------------------------------------------------------
    # PERMISSIVE profile - TLS 1.2 and 1.3. Internal, reached via the stream
    # layer when SNI starts with "tls12.". Identical in every other respect,
    # which is what makes any behavioural difference attributable.
    # -----------------------------------------------------------------------
    server {
        listen 9444 ssl;
        http2 on;
        server_name _;
        set $tls_profile_name "permissive-tls12-tls13";

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_session_cache   shared:SSL12:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       https;
            proxy_set_header   X-Forwarded-TLS-Version $ssl_protocol;
            proxy_set_header   X-Forwarded-TLS-Cipher  $ssl_cipher;
            proxy_set_header   X-TLS-Profile           $tls_profile_name;
            proxy_read_timeout 300s;
        }
    }

    # -----------------------------------------------------------------------
    # DIRECT CONTROL on :8444 - permissive, and it BYPASSES the stream layer,
    # so the stream front door itself can be ruled in or out as a cause.
    # -----------------------------------------------------------------------
    server {
        listen 8444 ssl;
        http2 on;
        server_name _;
        set $tls_profile_name "direct-control-bypasses-stream";

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       https;
            proxy_set_header   X-Forwarded-TLS-Version $ssl_protocol;
            proxy_set_header   X-TLS-Profile           $tls_profile_name;
            proxy_read_timeout 300s;
        }
    }
}
