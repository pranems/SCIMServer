worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Records the negotiated protocol and cipher for EVERY request. This is the
    # evidence trail: it distinguishes "the endpoint refused TLS 1.2" from
    # "something else went wrong".
    log_format tlsinfo '$time_iso8601 listener=$server_port proto=$ssl_protocol '
                       'cipher=$ssl_cipher sni=$ssl_server_name status=$status '
                       '"$request"';

    access_log /var/log/nginx/access.log tlsinfo;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    server_tokens off;

    # Shared proxy behaviour for both listeners. The only difference between the
    # two servers below is ssl_protocols, which keeps the comparison clean.
    map $ssl_protocol $tls_version_header { default $ssl_protocol; }

    # ---------------------------------------------------------------------
    # SUBJECT: TLS 1.3 ONLY. A TLS 1.2 ClientHello is rejected at the
    # handshake with a protocol_version alert; no HTTP is ever parsed.
    # ---------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name scim-tls13.local localhost;

        ssl_protocols       TLSv1.3;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_session_cache   shared:SSL13:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            # Non-standard, deliberately named. This is the signal an application
            # layer TLS policy would consume, and it is ONLY trustworthy because
            # this terminator is the sole path to the backend.
            proxy_set_header   X-Forwarded-TLS-Version $ssl_protocol;
            proxy_set_header   X-Forwarded-TLS-Cipher  $ssl_cipher;
            proxy_read_timeout 300s;
        }
    }

    # ---------------------------------------------------------------------
    # CONTROL: TLS 1.2 + 1.3. Same certificate, same backend, same config.
    # If this accepts TLS 1.2 and 8443 refuses it, the ONLY variable is
    # ssl_protocols, so the result is attributable.
    # ---------------------------------------------------------------------
    server {
        listen 8444 ssl;
        http2 on;
        server_name scim-tls12.local localhost;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_session_cache   shared:SSL12:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10m;

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-TLS-Version $ssl_protocol;
            proxy_set_header   X-Forwarded-TLS-Cipher  $ssl_cipher;
            proxy_read_timeout 300s;
        }
    }
}
