# TLS 1.3-only standalone SCIM Server.
#
# Topology:
#   client --TLS 1.3 ONLY--> nginx (terminates) --plain HTTP--> scimserver --> postgres
#
# The SCIM Server application does not terminate TLS (by design: api/src/main.ts
# serves plain HTTP behind `trust proxy`). The TLS version policy therefore lives
# entirely in the nginx terminator, which is exactly how a customer would deploy
# a TLS-1.3-only SCIM endpoint today.
#
# Usage:
#   pwsh ./up.ps1
#
name: scimserver-tls13

services:
  postgres:
    image: postgres:17
    container_name: scim-tls13-postgres
    environment:
      POSTGRES_DB: scimdb
      POSTGRES_USER: scim
      POSTGRES_PASSWORD: scim
    volumes:
      - pgdata-tls13:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scim -d scimdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/pranems/scimserver:latest
    container_name: scim-tls13-api
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://scim:scim@postgres:5432/scimdb?connect_timeout=10&pool_timeout=10
      PERSISTENCE_BACKEND: prisma
      JWT_SECRET: devjwtsecretkey123456
      OAUTH_CLIENT_SECRET: changeme-oauth
      SCIM_SHARED_SECRET: changeme-scim
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  tls:
    image: nginx:1.29-alpine
    container_name: scim-tls13-nginx
    ports:
      # 8443 = TLS 1.3 ONLY  (the endpoint under test)
      # 8444 = TLS 1.2 + 1.3 (control endpoint, proves the difference is the policy
      #        and not the certificate, DNS, backend or anything else)
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata-tls13:
