name: Membership CPU timeline diagnostic

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/membership-cpu-diagnostic.yml'
      - 'scripts/performance/**'
      - 'scripts/test/membership-cpu-trace.test.cjs'
      - 'scripts/test/membership-performance.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: membership-performance-qualification
  cancel-in-progress: false
  queue: max

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify admission isolation and CPU observer contracts
        timeout-minutes: 3
        run: |
          node --test scripts/test/membership-performance.test.cjs scripts/test/membership-cpu-trace.test.cjs

      - name: Observe one same-image block without release admission
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./scripts/performance/run-membership-qualification.ps1 `
            -TraceDiagnostic `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'test-results/cpu-timeline-diagnostic')

      - name: Retain complete and partial diagnostic evidence
        timeout-minutes: 4
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: membership-cpu-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cpu-timeline-diagnostic/
          if-no-files-found: error
          retention-days: 14
