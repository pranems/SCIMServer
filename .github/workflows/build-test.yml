name: Build Test Image

on:
  push:
    branches:
      - 'test/**'
      - 'dev/**'
      - 'feature/**'
      - 'feat/**'
      - 'ci/**'
      - 'fix/**'
      # A release branch is the single thing that most needs CI, and it was the
      # only common prefix missing here - pushing release/0.55.0 produced ZERO
      # runs, silently. That matters more on a corp-managed device than it looks:
      # `npm ci` inside a container cannot reach registry.npmjs.org (egress is
      # blocked by design, and the corporate .npmrc does not exist in the image),
      # so the Docker image CANNOT be built locally at all. CI is not a
      # convenience for the container form factor here - it is the only way to
      # produce or validate the artifact.
      - 'release/**'
  # Required so the workflow runs on Dependabot (and any fork) PRs into master.
  # Without this, branch protection blocks every Dependabot PR forever because
  # the validate / build-and-push contexts never appear (no push trigger fires
  # for `dependabot/**` branches).
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag suffix (e.g., "collision-ui" creates test-collision-ui)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pranems/scimserver

jobs:
  # OPS-1: Same validation gate as build-and-push.yml. Test images cannot
  # be pushed without lint + unit + E2E + web build all passing.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # prisma.config.ts uses env('DATABASE_URL') which throws at config-load time
    # if the var is missing - even for `prisma generate` which doesn't connect.
    # Tests run with PERSISTENCE_BACKEND=inmemory so the value is never used.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      # Runs BEFORE any install, and in CI rather than only at pre-push, because
      # the pre-push gate cannot see a Dependabot PR, a fork PR, or anyone
      # pushing with --no-verify. A lockfile entry resolved through a corporate
      # feed proxy carries an internal host and a sha1 integrity among ~725
      # sha512 siblings - it leaks an internal endpoint from a public repo and
      # weakens the lockfile's own tamper-evidence, and no other gate here can
      # see it. See docs/strategy/NPM_SUPPLY_CHAIN_QUARANTINE_POLICY.md.
      - name: Verify lockfile provenance
        run: node scripts/check-lockfile-provenance.mjs

      - name: Install API dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund

      # Prisma client must be generated BEFORE lint so type-aware ESLint rules
      # (no-redundant-type-constituents, require-await) can resolve @prisma/client
      # types. Without it those types appear as 'error' types and trip lint.
      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      - name: Lint API
        working-directory: api
        run: npm run lint

      # Migration linter - blocks destructive Prisma DDL on new migrations.
      # Historical destructives are accepted via api/prisma/.migration-lint-baseline.json
      # (SHA-256 hash allowlist). Set ALLOW_DESTRUCTIVE_MIGRATION=1 in CI plus
      # justify in the PR description to override for new destructive migrations.
      - name: Lint Prisma migrations (additive-only enforcement)
        working-directory: api
        run: npx ts-node --transpile-only src/scripts/lint-migrations.ts

      - name: Unit tests (API)
        working-directory: api
        run: npm test

      # Two specs filter persistent logs by minDurationMs which the InMemory
      # log repository does not honor. They run against real Prisma backend in
      # the post-deploy live-test suite (scripts/live-test.ps1). Excluded here
      # to keep CI fast and PG-free.
      # --maxWorkers=2 matches the 2-core GitHub-hosted runner. The default
      # config uses 4 workers (faster for local dev with more cores), but on
      # CI the over-subscription causes ECONNRESET in parallel-HTTP tests
      # (multi-endpoint-isolation: 4 simultaneous Promise.all POSTs).
      - name: E2E tests (API, in-memory backend)
        working-directory: api
        run: npm run test:e2e -- --maxWorkers=2 --testPathIgnorePatterns 'endpoint-scoped-logs.e2e-spec.ts' --testPathIgnorePatterns 'log-config.e2e-spec.ts'
        env:
          PERSISTENCE_BACKEND: inmemory
          SCIM_SHARED_SECRET: ci-shared-secret-not-for-production
          JWT_SECRET: ci-jwt-secret-not-for-production
          OAUTH_CLIENT_SECRET: ci-oauth-secret-not-for-production

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Test web (Vitest)
        working-directory: web
        run: npm test

      - name: Build web (production bundle)
        working-directory: web
        run: npm run build

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    # Explicit job-level permissions (workflow-level grants the same, but a
    # job-level block makes the intent unambiguous and matches build-and-push.yml).
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine test tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="test-${{ inputs.test_tag }}"
          else
            # Extract branch name and sanitize for Docker tag
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH_CLEAN=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
            TAG="test-${BRANCH_CLEAN}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building test image with tag: ${TAG}"

      # docker/metadata-action emits OCI labels including
      # org.opencontainers.image.source which GHCR uses to auto-link the
      # package to this repository on first push. Without this label, pushes
      # to a pre-existing package owned by the user (not the repo) are denied
      # with 'permission_denied: write_package'.
      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_TAG=${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Container smoke test: prove the image actually BOOTS and serves before
      # anything downstream trusts it.
      #
      # Added 2026-07-30 alongside removing npm from the runtime image. Until
      # now the only post-build gate was Trivy, which scans a filesystem and
      # never starts the process - so a change that stripped something the
      # entrypoint needed would have produced a GREENER Trivy result and a
      # container that cannot start. A scan is not a smoke test, and "fewer
      # CVEs" must never be purchasable with "does not run".
      #
      # Deliberately exercises the inmemory backend so no database is required:
      # this asserts the ENTRYPOINT and the HTTP surface, which is the part the
      # npm removal could plausibly break. The Prisma migrate path is covered by
      # the compose gate and by the live-test suite.
      - name: Container smoke test (image boots and serves)
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/scimserver@${{ steps.build.outputs.digest }}"
          echo "Booting $IMAGE"
          docker run -d --name scim-smoke \
            -e PERSISTENCE_BACKEND=inmemory \
            -e NODE_ENV=production \
            -e SCIM_SHARED_SECRET=smoke-shared \
            -e JWT_SECRET=smoke-jwt \
            -e OAUTH_CLIENT_SECRET=smoke-oauth \
            -p 8080:8080 "$IMAGE"

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/scim/health -o /tmp/health.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 3
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Container never became healthy - dumping logs"
            docker logs scim-smoke || true
            docker rm -f scim-smoke || true
            exit 1
          fi

          echo "health: $(cat /tmp/health.json)"
          grep -q '"status":"ok"' /tmp/health.json || {
            echo "::error::/scim/health did not report status=ok"
            docker logs scim-smoke || true
            docker rm -f scim-smoke || true
            exit 1
          }

          # Assert an OUTCOME beyond "it responded": the SCIM discovery surface
          # must serve, which proves the app booted rather than merely that a
          # port opened.
          curl -fsS http://127.0.0.1:8080/scim/v2/ServiceProviderConfig -o /tmp/spc.json
          grep -q 'urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig' /tmp/spc.json || {
            echo "::error::ServiceProviderConfig did not carry its SCIM schema URN"
            cat /tmp/spc.json || true
            docker logs scim-smoke || true
            docker rm -f scim-smoke || true
            exit 1
          }

          # npm must be GONE - this is the change under test, so assert it
          # directly rather than inferring it from the Trivy result.
          if docker run --rm --entrypoint sh "$IMAGE" -c 'command -v npm || command -v npx'; then
            echo "::error::npm/npx is still present in the runtime image"
            docker rm -f scim-smoke || true
            exit 1
          fi
          echo "npm and npx are absent from the runtime image, as intended."

          docker rm -f scim-smoke
          echo "Container smoke test PASSED."

      # OPS-3: Trivy CVE scan on the just-pushed test image. Same gating as
      # build-and-push.yml so test images can never become "well, it scanned
      # clean once when we ran it manually" snowflakes.
      # Documented exceptions live in repo-root .trivyignore.
      #
      # NOTE: Trivy + OCI registries require lowercase image names. The
      # github.repository env var preserves the repo's casing
      # (`pranems/SCIMServer`) so we use the lowercase package name
      # explicitly here. Without this, Trivy fails with "could not parse
      # reference" before scanning.
      - name: Trivy image scan (HIGH+CRITICAL gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/scimserver@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Summary
        run: |
          echo "## Test Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test this image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`powershell" >> $GITHUB_STEP_SUMMARY
          echo "az containerapp update \\" >> $GITHUB_STEP_SUMMARY
          echo "  -n YOUR-APP-NAME \\" >> $GITHUB_STEP_SUMMARY
          echo "  -g YOUR-RESOURCE-GROUP \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: This is a test image - not tagged as \`latest\` and won't trigger update notifications for other users." >> $GITHUB_STEP_SUMMARY
