name: Dependency pins review

# WHY THIS EXISTS
# ---------------
# api/package.json pins transitive packages via `overrides`, each one added to
# resolve a HIGH CVE. Two properties make that list dangerous over time:
#
#   1. An override FREEZES the version. The tree can never float off it, so the
#      pin cannot self-heal when upstream ships a fix.
#   2. Dependabot does NOT manage the `overrides` block, so nothing proposes
#      changing it.
#
# The result is that the version pinned as the FIX for one advisory can later
# become the VULNERABLE version of the next. fast-uri did exactly that: pinned
# at 3.1.4 to fix an earlier CVE, and 3.1.4 is the vulnerable version of
# CVE-2026-18446. Nothing in the repo watched for it - Trivy caught it only
# after building the image, by failing a required status check on a push.
#
# This job is the missing watch. It is also strictly BROADER than Trivy, which
# gates on HIGH+CRITICAL only: the first real run flagged 7 vulnerable pins, of
# which 6 were medium and therefore invisible to the image scan.
#
# It is deliberately NOT a blocking gate. It needs the network and the GitHub
# Advisory API, so making it block a push would trade a real security signal
# for a flaky one. It opens an Issue instead, the same shape as the
# .trivyignore review.

on:
  schedule:
    # Mondays 03:30 UTC, half an hour before the trivyignore review, so the two
    # reports land together and a single sweep can act on both.
    - cron: "30 3 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    # Re-run whenever the pins themselves change, so a bad pin is caught at the
    # moment it lands rather than up to a week later.
    paths: ["api/package.json"]

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Run check-dependency-pins
        id: check
        working-directory: api
        env:
          # Unauthenticated advisory queries are rate limited; the token raises
          # the ceiling. Read-only, no elevated scope needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script exits 1 when a pin is vulnerable. That is a signal, not
          # a job failure, so it is captured rather than allowed to abort.
          REPORT_PATH="$RUNNER_TEMP/pins-report.md"
          set +e
          npm run -s check:pins > "$REPORT_PATH" 2> "$RUNNER_TEMP/pins-summary.txt"
          set -e
          FINDING_COUNT=$(grep -E '^FINDING_COUNT=' "$RUNNER_TEMP/pins-summary.txt" | cut -d= -f2)
          UNCHECKED_COUNT=$(grep -E '^UNCHECKED_COUNT=' "$RUNNER_TEMP/pins-summary.txt" | cut -d= -f2)
          OK=$(grep -E '^OK=' "$RUNNER_TEMP/pins-summary.txt" | cut -d= -f2)
          echo "finding_count=${FINDING_COUNT}" >> "$GITHUB_OUTPUT"
          echo "unchecked_count=${UNCHECKED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "ok=${OK}" >> "$GITHUB_OUTPUT"
          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
          echo "::group::dependency pins report"
          cat "$REPORT_PATH"
          echo "::endgroup::"

      - name: Open or update review Issue
        if: steps.check.outputs.ok != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ steps.check.outputs.report_path }}
          FINDING_COUNT: ${{ steps.check.outputs.finding_count }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const title = '[security] pinned dependency review needed';

            // Update in place so a weekly schedule cannot produce duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,supply-chain,dependency-pins',
              per_page: 100,
            });
            const match = existing.data.find(i => i.title === title);

            const footer =
              `\n\n---\n_Auto-generated by .github/workflows/dependency-pins-review.yml run #${context.runNumber}._`;
            const fullBody = body + footer;

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: fullBody,
              });
              core.notice(`Updated existing issue #${match.number} (findings=${process.env.FINDING_COUNT}).`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: fullBody,
                labels: ['security', 'supply-chain', 'dependency-pins'],
              });
              core.notice(`Opened issue #${created.data.number} (findings=${process.env.FINDING_COUNT}).`);
            }

      - name: Auto-close the Issue once every pin is clean
        if: steps.check.outputs.ok == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[security] pinned dependency review needed';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,supply-chain,dependency-pins',
              per_page: 100,
            });
            const match = open.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: 'All pinned versions are now clear of known advisories. Closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'closed',
              });
              core.notice(`Closed issue #${match.number}.`);
            } else {
              core.notice('All pins clean; no open issue to close.');
            }
