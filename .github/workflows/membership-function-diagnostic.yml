name: Membership native function diagnostic

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/membership-function-diagnostic.yml"
      - "scripts/performance/**"
      - "scripts/test/membership-*.test.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: membership-performance-qualification
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify profile isolation and capture contracts
        timeout-minutes: 3
        run: |
          node --test scripts/test/membership-performance.test.cjs scripts/test/membership-cpu-trace.test.cjs scripts/test/membership-v8-profile.test.cjs

      - name: Profile one frozen old/current block without release admission
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./scripts/performance/run-membership-qualification.ps1 `
            -ProfileDiagnostic `
            -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'test-results/native-function-diagnostic')

      - name: Retain complete and partial diagnostic evidence
        timeout-minutes: 4
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: membership-function-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/native-function-diagnostic/
          if-no-files-found: error
          retention-days: 14
