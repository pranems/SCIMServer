# Local-only override so the Docker form factor can be exercised WITHOUT a local
# build. The npm registry is TLS-blocked on this host, so `docker build` cannot
# run `npm ci`; the image is built in CI instead and pulled here.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ci-image.yml up -d --no-build
#
# JWKS_HOST_ALLOWLIST is set because the base compose file omits it, which makes
# 5 WIF-verify live assertions (9z-AV.T7/T8, 9z-BK.T2/T3/T4) fail for an
# environment reason unrelated to the code under test.
services:
  api:
    image: ghcr.io/pranems/scimserver:0.54.0-alpha.12
    pull_policy: missing
    environment:
      JWKS_HOST_ALLOWLIST: login.microsoftonline.com,login.windows.net
